<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-labelledby="t d">
  <title id="t">色だけで区別しない</title>
  <desc id="d">左は注文の一覧で、状態が赤と緑の丸だけで示されている。右は丸に加えて「✕ エラー」「✓ 完了」の形と言葉が付いている。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #222; }
    .bad { fill: #b42318; font-weight: bold; font-size: 15px; }
    .good { fill: #067647; font-weight: bold; font-size: 15px; }
    .screen { fill: #fff; stroke: #9a9a9a; }
    .field { fill: #fff; stroke: #b0b0b0; }
    .muted { fill: #6b6b6b; font-size: 12px; }
    .btn { fill: #1f5fbf; }
    .btntext { fill: #fff; font-weight: bold; }
    .ghost { fill: #fff; stroke: #1f5fbf; stroke-width: 1.5; }
    .ghosttext { fill: #1f5fbf; font-weight: bold; }
    .caption { font-size: 13px; fill: #444; }
    .h { font-weight: bold; font-size: 15px; }
    .textline { fill: #d5d5d5; }
    .small { font-size: 12px; }
    .link { fill: #1f5fbf; text-decoration: underline; }
  </style>
  <style>
    .red { fill: #d0342c; }
    .green { fill: #2e9e4f; }
    .redtext { fill: #b42318; font-weight: bold; }
    .greentext { fill: #067647; font-weight: bold; }
  </style>
  <rect width="760" height="240" fill="#fff"/>

  <text x="20" y="22" class="bad">避けたい例</text>
  <rect x="20" y="34" width="340" height="170" rx="8" class="screen"/>
  <text x="40" y="66">注文 1001</text><circle cx="320" cy="61" r="7" class="red"/>
  <line x1="40" y1="78" x2="340" y2="78" stroke="#ddd"/>
  <text x="40" y="102">注文 1002</text><circle cx="320" cy="97" r="7" class="green"/>
  <line x1="40" y1="114" x2="340" y2="114" stroke="#ddd"/>
  <text x="40" y="138">注文 1003</text><circle cx="320" cy="133" r="7" class="red"/>
  <line x1="40" y1="150" x2="340" y2="150" stroke="#ddd"/>
  <text x="40" y="174">注文 1004</text><circle cx="320" cy="169" r="7" class="green"/>
  <text x="20" y="230" class="caption">色だけ。赤と緑の区別がつきにくい人には同じに見える</text>

  <text x="400" y="22" class="good">改善例</text>
  <rect x="400" y="34" width="340" height="170" rx="8" class="screen"/>
  <text x="420" y="66">注文 1001</text><circle cx="640" cy="61" r="7" class="red"/><text x="656" y="66" class="redtext">✕ エラー</text>
  <line x1="420" y1="78" x2="720" y2="78" stroke="#ddd"/>
  <text x="420" y="102">注文 1002</text><circle cx="640" cy="97" r="7" class="green"/><text x="656" y="102" class="greentext">✓ 完了</text>
  <line x1="420" y1="114" x2="720" y2="114" stroke="#ddd"/>
  <text x="420" y="138">注文 1003</text><circle cx="640" cy="133" r="7" class="red"/><text x="656" y="138" class="redtext">✕ エラー</text>
  <line x1="420" y1="150" x2="720" y2="150" stroke="#ddd"/>
  <text x="420" y="174">注文 1004</text><circle cx="640" cy="169" r="7" class="green"/><text x="656" y="174" class="greentext">✓ 完了</text>
  <text x="400" y="230" class="caption">色に加えて、形と言葉でも伝える</text>
</svg>
