<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t3 d3">
  <title id="t3">操作と結果の対応づけ（コンロとつまみ）</title>
  <desc id="d3">左は四角に並んだ四つのコンロに対して、つまみが一列に並んでいる。右はつまみもコンロと同じ四角の並びになっている。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #222; }
    .bad { fill: #b42318; font-weight: bold; font-size: 15px; }
    .good { fill: #067647; font-weight: bold; font-size: 15px; }
    .top { fill: #f2f2f2; stroke: #9a9a9a; }
    .burner { fill: #fff; stroke: #555; stroke-width: 2; }
    .ring { fill: none; stroke: #999; }
    .knob { fill: #ddd; stroke: #555; stroke-width: 2; }
    .mark { stroke: #555; stroke-width: 2; }
    .q { fill: #b42318; font-weight: bold; font-size: 14px; }
    .caption { font-size: 13px; fill: #444; }
  </style>
  <rect width="760" height="300" fill="#fff"/>

  <text x="20" y="22" class="bad">避けたい例</text>
  <rect x="40" y="36" width="300" height="150" rx="6" class="top"/>
  <circle cx="110" cy="80" r="26" class="burner"/><circle cx="110" cy="80" r="14" class="ring"/>
  <circle cx="270" cy="80" r="26" class="burner"/><circle cx="270" cy="80" r="14" class="ring"/>
  <circle cx="110" cy="145" r="26" class="burner"/><circle cx="110" cy="145" r="14" class="ring"/>
  <circle cx="270" cy="145" r="26" class="burner"/><circle cx="270" cy="145" r="14" class="ring"/>
  <circle cx="100" cy="226" r="13" class="knob"/><line x1="100" y1="226" x2="100" y2="215" class="mark"/>
  <circle cx="160" cy="226" r="13" class="knob"/><line x1="160" y1="226" x2="160" y2="215" class="mark"/>
  <circle cx="220" cy="226" r="13" class="knob"/><line x1="220" y1="226" x2="220" y2="215" class="mark"/>
  <circle cx="280" cy="226" r="13" class="knob"/><line x1="280" y1="226" x2="280" y2="215" class="mark"/>
  <text x="100" y="258" text-anchor="middle" class="q">?</text>
  <text x="160" y="258" text-anchor="middle" class="q">?</text>
  <text x="220" y="258" text-anchor="middle" class="q">?</text>
  <text x="280" y="258" text-anchor="middle" class="q">?</text>
  <text x="20" y="288" class="caption">どのつまみがどのコンロ？ 毎回迷う</text>

  <text x="400" y="22" class="good">改善例</text>
  <rect x="420" y="36" width="300" height="150" rx="6" class="top"/>
  <circle cx="490" cy="80" r="26" class="burner"/><circle cx="490" cy="80" r="14" class="ring"/>
  <circle cx="650" cy="80" r="26" class="burner"/><circle cx="650" cy="80" r="14" class="ring"/>
  <circle cx="490" cy="145" r="26" class="burner"/><circle cx="490" cy="145" r="14" class="ring"/>
  <circle cx="650" cy="145" r="26" class="burner"/><circle cx="650" cy="145" r="14" class="ring"/>
  <circle cx="490" cy="212" r="13" class="knob"/><line x1="490" y1="212" x2="490" y2="201" class="mark"/>
  <circle cx="650" cy="212" r="13" class="knob"/><line x1="650" y1="212" x2="650" y2="201" class="mark"/>
  <circle cx="490" cy="250" r="13" class="knob"/><line x1="490" y1="250" x2="490" y2="239" class="mark"/>
  <circle cx="650" cy="250" r="13" class="knob"/><line x1="650" y1="250" x2="650" y2="239" class="mark"/>
  <text x="400" y="288" class="caption">つまみの並びがコンロと同じ。見れば分かる</text>
</svg>
