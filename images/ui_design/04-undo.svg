<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="t d">
  <title id="t">取り消せるなら、確認は要らない</title>
  <desc id="d">左はふだんの保存にも「保存しますか？」の確認が出る。右は削除のあとに「メモを削除しました」と「元に戻す」が出て、確認なしで取り消せる。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #222; }
    .bad { fill: #b42318; font-weight: bold; font-size: 15px; }
    .good { fill: #067647; font-weight: bold; font-size: 15px; }
    .screen { fill: #fff; stroke: #9a9a9a; }
    .field { fill: #fff; stroke: #b0b0b0; }
    .muted { fill: #6b6b6b; font-size: 12px; }
    .btn { fill: #1f5fbf; }
    .btntext { fill: #fff; font-weight: bold; }
    .ghost { fill: #fff; stroke: #1f5fbf; stroke-width: 1.5; }
    .ghosttext { fill: #1f5fbf; font-weight: bold; }
    .caption { font-size: 13px; fill: #444; }
    .h { font-weight: bold; font-size: 15px; }
    .textline { fill: #d5d5d5; }
    .small { font-size: 12px; }
    .link { fill: #1f5fbf; text-decoration: underline; }
  </style>
  <style>
    .dim { fill: #ececec; stroke: #ccc; }
    .dialog { fill: #fff; stroke: #999; }
    .ghostg { fill: #fff; stroke: #888; stroke-width: 1.5; }
    .ghostgtext { fill: #333; font-weight: bold; }
    .toast { fill: #333; }
    .toasttext { fill: #fff; }
    .undo { fill: #8ab4f8; font-weight: bold; }
  </style>
  <rect width="760" height="260" fill="#fff"/>

  <text x="20" y="22" class="bad">避けたい例</text>
  <rect x="20" y="34" width="340" height="190" rx="8" class="dim"/>
  <rect x="70" y="70" width="240" height="100" rx="8" class="dialog"/>
  <text x="90" y="104" class="h">保存しますか？</text>
  <rect x="150" y="128" width="80" height="30" rx="6" class="ghostg"/>
  <text x="190" y="148" text-anchor="middle" class="ghostgtext">キャンセル</text>
  <rect x="240" y="128" width="60" height="30" rx="6" class="btn"/>
  <text x="270" y="148" text-anchor="middle" class="btntext">OK</text>
  <text x="20" y="250" class="caption">ふだんの保存にも確認。読まずに OK を押す癖がつく</text>

  <text x="400" y="22" class="good">改善例</text>
  <rect x="400" y="34" width="340" height="190" rx="8" class="screen"/>
  <text x="420" y="64" class="h">メモ</text>
  <text x="420" y="96">買い物メモ</text>
  <line x1="420" y1="108" x2="720" y2="108" stroke="#ddd"/>
  <text x="420" y="134">会議の準備</text>
  <line x1="420" y1="146" x2="720" y2="146" stroke="#ddd"/>
  <rect x="420" y="174" width="300" height="36" rx="6" class="toast"/>
  <text x="432" y="197" class="toasttext">メモを削除しました</text>
  <text x="708" y="197" text-anchor="end" class="undo">元に戻す</text>
  <text x="400" y="250" class="caption">ふだんの操作は確認なし。取り消せる形にする</text>
</svg>
