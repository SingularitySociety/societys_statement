<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
  <title id="t">ログイン画面のアンチパターン</title>
  <desc id="d">左はメールアドレスを二回入れさせ、パスワードは隠したままで表示できず、貼り付けが禁止されているログイン画面。右はメールアドレスは一回、パスワードは「表示」で見られ、パスワードマネージャーからの入力と貼り付けができる画面。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #222; }
    .bad { fill: #b42318; font-weight: bold; font-size: 15px; }
    .good { fill: #067647; font-weight: bold; font-size: 15px; }
    .screen { fill: #fff; stroke: #9a9a9a; }
    .field { fill: #fff; stroke: #b0b0b0; }
    .muted { fill: #6b6b6b; font-size: 12px; }
    .btn { fill: #1f5fbf; }
    .btntext { fill: #fff; font-weight: bold; }
    .ghost { fill: #fff; stroke: #1f5fbf; stroke-width: 1.5; }
    .ghosttext { fill: #1f5fbf; font-weight: bold; }
    .caption { font-size: 13px; fill: #444; }
    .h { font-weight: bold; font-size: 15px; }
    .textline { fill: #d5d5d5; }
    .small { font-size: 12px; }
    .link { fill: #1f5fbf; text-decoration: underline; }
    .value { font-size: 12px; }
    .err { fill: #b42318; font-size: 12px; }
    .errfield { fill: #fff; stroke: #b42318; stroke-width: 2; }
    .ok { fill: #067647; font-weight: bold; }
    .auto { fill: #eef6ee; stroke: #8fc39a; }
  </style>
  <style>
    .dots { font-size: 14px; letter-spacing: 2px; }
    .ban { fill: #b42318; font-size: 11px; }
  </style>
  <rect width="760" height="330" fill="#fff"/>

  <text x="20" y="22" class="bad">避けたい例</text>
  <rect x="20" y="34" width="340" height="252" rx="8" class="screen"/>
  <text x="40" y="60" class="small">メールアドレス</text>
  <rect x="40" y="66" width="300" height="26" rx="4" class="field"/><text x="48" y="84" class="value">you@example.com</text>
  <text x="40" y="112" class="small">メールアドレス（確認のためもう一度）</text>
  <rect x="40" y="118" width="300" height="26" rx="4" class="field"/>
  <text x="40" y="164" class="small">パスワード</text>
  <rect x="40" y="170" width="300" height="26" rx="4" class="field"/><text x="48" y="189" class="dots">●●●●●●●●●●●●</text>
  <text x="40" y="214" class="ban">貼り付けはできません</text>
  <text x="40" y="230" class="ban">8文字以上、大文字・数字・記号を含めてください</text>
  <rect x="240" y="244" width="100" height="30" rx="6" class="btn"/><text x="290" y="264" text-anchor="middle" class="btntext">ログイン</text>
  <text x="20" y="314" class="caption">二回入れさせ、見せず、貼らせず、規則で縛る</text>

  <text x="400" y="22" class="good">改善例</text>
  <rect x="400" y="34" width="340" height="252" rx="8" class="screen"/>
  <text x="420" y="60" class="small">メールアドレス</text>
  <rect x="420" y="66" width="300" height="26" rx="4" class="field"/><text x="428" y="84" class="value">you@example.com</text>
  <text x="420" y="118" class="small">パスワード</text>
  <rect x="420" y="124" width="300" height="26" rx="4" class="field"/><text x="428" y="142" class="value">correct-horse-battery</text>
  <text x="712" y="142" text-anchor="end" class="link">隠す</text>
  <text x="420" y="172" class="muted">長いほど安全です</text>
  <text x="420" y="190" class="muted">貼り付けやパスワードマネージャーも使えます</text>
  <rect x="620" y="236" width="100" height="30" rx="6" class="btn"/><text x="670" y="256" text-anchor="middle" class="btntext">ログイン</text>
  <text x="400" y="314" class="caption">一回だけ、見せられる、貼れる、長さで守る</text>
</svg>
