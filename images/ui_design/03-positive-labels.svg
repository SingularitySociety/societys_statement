<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
  <title id="t">肯定形と否定形をまぜない</title>
  <desc id="d">左は「通知を受け取る」「メールを受け取らない」「音を鳴らさない」「ダークモードを使わない」が並び、オンの意味が行ごとに違う。右は全部「〜する」の形にそろっている。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #222; }
    .bad { fill: #b42318; font-weight: bold; font-size: 15px; }
    .good { fill: #067647; font-weight: bold; font-size: 15px; }
    .screen { fill: #fff; stroke: #9a9a9a; }
    .field { fill: #fff; stroke: #b0b0b0; }
    .muted { fill: #6b6b6b; font-size: 12px; }
    .btn { fill: #1f5fbf; }
    .btntext { fill: #fff; font-weight: bold; }
    .ghost { fill: #fff; stroke: #1f5fbf; stroke-width: 1.5; }
    .ghosttext { fill: #1f5fbf; font-weight: bold; }
    .caption { font-size: 13px; fill: #444; }
    .h { font-weight: bold; font-size: 15px; }
    .textline { fill: #d5d5d5; }
    .small { font-size: 12px; }
    .link { fill: #1f5fbf; text-decoration: underline; }
  </style>
  <style>
    .on { fill: #1f5fbf; }
    .off { fill: #c7c7c7; }
    .knob { fill: #fff; }
    .neg { fill: #b42318; }
  </style>
  <rect width="760" height="300" fill="#fff"/>

  <text x="20" y="22" class="bad">避けたい例</text>
  <rect x="20" y="34" width="340" height="230" rx="8" class="screen"/>
  <text x="40" y="62" class="h">通知の設定</text>
  <text x="40" y="97">通知を受け取る</text>
  <rect x="290" y="82" width="40" height="22" rx="11" class="on"/><circle cx="319" cy="93" r="8" class="knob"/>
  <text x="40" y="137">メールを<tspan class="neg">受け取らない</tspan></text>
  <rect x="290" y="122" width="40" height="22" rx="11" class="off"/><circle cx="301" cy="133" r="8" class="knob"/>
  <text x="40" y="177">音を<tspan class="neg">鳴らさない</tspan></text>
  <rect x="290" y="162" width="40" height="22" rx="11" class="on"/><circle cx="319" cy="173" r="8" class="knob"/>
  <text x="40" y="217">ダークモードを<tspan class="neg">使わない</tspan></text>
  <rect x="290" y="202" width="40" height="22" rx="11" class="off"/><circle cx="301" cy="213" r="8" class="knob"/>
  <text x="20" y="290" class="caption">オンが「する」なのか「しない」なのか、毎行考える</text>

  <text x="400" y="22" class="good">改善例</text>
  <rect x="400" y="34" width="340" height="230" rx="8" class="screen"/>
  <text x="420" y="62" class="h">通知の設定</text>
  <text x="420" y="97">通知を受け取る</text>
  <rect x="670" y="82" width="40" height="22" rx="11" class="on"/><circle cx="699" cy="93" r="8" class="knob"/>
  <text x="420" y="137">メールを受け取る</text>
  <rect x="670" y="122" width="40" height="22" rx="11" class="on"/><circle cx="699" cy="133" r="8" class="knob"/>
  <text x="420" y="177">音を鳴らす</text>
  <rect x="670" y="162" width="40" height="22" rx="11" class="off"/><circle cx="681" cy="173" r="8" class="knob"/>
  <text x="420" y="217">ダークモードを使う</text>
  <rect x="670" y="202" width="40" height="22" rx="11" class="on"/><circle cx="699" cy="213" r="8" class="knob"/>
  <text x="400" y="290" class="caption">全部「〜する」。オン＝する、で迷わない</text>
</svg>
